---
apiVersion: influxdata.com/v2alpha1
kind: Task
metadata:
  name: downsample-52w-to-260w
spec:
  name: downsample-52w-to-260w
  description: >-
    Downsamples the 52w tier to 260w (mean/min/max/median cascade).
    Refreshes every 86400s and rewrites 1 closed window(s) of 260w, clamped by retention, so a run missed
    during an outage is repaired by the next one.
  every: 86400s
  offset: 30s
  query: |

    // Last CLOSED window boundary, epoch-aligned exactly as aggregateWindow
    // grids its own windows. now() is pinned to the task's scheduled time, so
    // this is deterministic and identical across retries.
    w     = int(v: 260w)
    n     = int(v: now())
    stop  = n - n % w
    start = stop - int(v: 157248000s)

    src = from(bucket: "traffic-52w")
      |> range(start: time(v: start), stop: time(v: stop))
      |> filter(fn: (r) => r._measurement == "network_interface")

    src
      |> filter(fn: (r) => r._field == "statistics_out-octets_mean" or r._field == "statistics_in-octets_mean")
      |> aggregateWindow(every: 260w, fn: mean, createEmpty: false, timeSrc: "_start")
      |> to(bucket: "traffic-260w")

    src
      |> filter(fn: (r) => r._field == "statistics_out-octets_min" or r._field == "statistics_in-octets_min")
      |> aggregateWindow(every: 260w, fn: min, createEmpty: false, timeSrc: "_start")
      |> to(bucket: "traffic-260w")

    src
      |> filter(fn: (r) => r._field == "statistics_out-octets_max" or r._field == "statistics_in-octets_max")
      |> aggregateWindow(every: 260w, fn: max, createEmpty: false, timeSrc: "_start")
      |> to(bucket: "traffic-260w")

    src
      |> filter(fn: (r) => r._field == "statistics_out-octets_median" or r._field == "statistics_in-octets_median")
      |> aggregateWindow(every: 260w, fn: median, createEmpty: false, timeSrc: "_start")
      |> to(bucket: "traffic-260w")

---
apiVersion: influxdata.com/v2alpha1
kind: Bucket
metadata:
  name: traffic-520w
spec:
  name: traffic-520w
  description: >-
    Traffic RATES in octets/s at 520w resolution, stored as
    mean/min/max/median fields. NOT counters: the rate is derived on a
    2s lattice before the first aggregation, so consumers must
    multiply by 8 for bits/s and must NOT apply derivative(). NO cascade task writes this tier: a 520w-wide window cannot fit inside the source tier's retention, so it would only ever be summarised from a fraction of itself. Populated by backfill.py.
  # retention: infinite: terminal tier, no consumer and no coarser fallback
