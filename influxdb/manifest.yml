      |> map(fn: (r) => ({r with _field: r._field + "_mean"}))
      |> to(bucket: "traffic-1m")

    rate
      |> aggregateWindow(every: 1m, fn: min, createEmpty: false, timeSrc: "_start")
      |> map(fn: (r) => ({r with _field: r._field + "_min"}))
      |> to(bucket: "traffic-1m")

    rate
      |> aggregateWindow(every: 1m, fn: max, createEmpty: false, timeSrc: "_start")
      |> map(fn: (r) => ({r with _field: r._field + "_max"}))
      |> to(bucket: "traffic-1m")

    rate
      |> aggregateWindow(every: 1m, fn: median, createEmpty: false, timeSrc: "_start")
      |> map(fn: (r) => ({r with _field: r._field + "_median"}))
