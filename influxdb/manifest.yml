kind: Bucket
metadata:
  name: traffic-260w
spec:
  name: traffic-260w
  description: >-
    Traffic RATES in octets/s at 260w resolution, stored as
    mean/min/max/median fields. NOT counters: the rate is derived on a
    2s lattice before the first aggregation, so consumers must
