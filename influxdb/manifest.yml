# http://docs.influxdb.com/influxdb/v2/reference/syntax/influxql/spec#literals
#
# Retention rule: a tier's retention must be >= the `every` interval of the
# task that reads FROM it downstream, otherwise the source data expires
# before the next task can consume it (cascading empty buckets). Each
# retention below = 2x the consuming task's `every`, as safety margin.
# Floor: InfluxDB rejects any expire < 3600s (1h), so short tiers are
# clamped up to 3600s even where 2x would be smaller.
# The init bucket "infldb" (set via DOCKER_INFLUXDB_INIT_BUCKET in
# docker-compose.yml) is the raw/source bucket — not defined here.

#########################################################################
# bucket/task that downsamples 5s samples to 1-minute mean
#########################################################################

apiVersion: influxdata.com/v2alpha1
kind: Bucket
metadata:
  name: traffic-1m
spec:
  name: traffic-1m
  description: Traffic metrics at 1-minute mean resolution; source data older than the raw-bucket retention.
  retentionRules:
    - type: expire
      everySeconds: 3600   # floored to InfluxDB minimum (1h); 2x rule would give 600s (10m) but InfluxDB rejects any expire < 3600s. Longer retention is safe — task still consumes before expiry.

---
apiVersion: influxdata.com/v2alpha1
kind: Task
metadata:
  name: downsample-5s-to-1m
spec:
  name: downsample-5s-to-1m
  description: Downsamples the 5s tier to 1m mean and writes it to the traffic-1m bucket.
  every: 1m
  query: |

    from(bucket: "infldb")
      |> range(start: -task.every)
      |> filter(fn: (r) => r._measurement == "statistics_out-octets" or r._measurement == "statistics_in-octets")
      |> aggregateWindow(every: 1m, fn: mean, createEmpty: false)
      |> to(bucket: "traffic-1m")

