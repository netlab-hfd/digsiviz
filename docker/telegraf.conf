[agent]
  interval = "500ms"
  debug = true
  quiet = false

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["gnmi_data"]
  offset = "newest"
  data_format = "json"
  
  name_override = "network_interface"

  tag_keys = ["hostname", "interface_name", "ip"]

  # Store only the two counters that are actually queried.
  #
  # gnmiclient.py flattens the whole gNMI interface subtree, so a message
  # carries 78 numeric fields per interface (hold-times, LACP port priority,
  # per-frame-size frame counters, ...). Measured on 2026-08-08: the raw bucket
  # held 713 series and 16,365,546 points, of which the 2 fields below account
  # for 18 series and 420,228 points -- 2.5 % of the series and 2.57 % of the
  # points. Nothing in grafana/, influxdb/ or experiments/ references any other
  # field.
  #
  # This filters at storage. The deeper variant is to narrow the gNMI
  # subscription paths themselves, which would also cut poll time and Kafka
  # volume, but it would change what the DigSiViz frontend receives -- left as
  # future work.
  #
  # Telegraf >= 1.29 spelling; the older name for this option is `fieldpass`.
  fieldinclude = ["statistics_in-octets", "statistics_out-octets"]

  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05.999999999Z07:00"
  

  json_string_fields = [
    "interface_data_admin-state",
    "interface_data_oper-state", 
    "interface_data_last-change",
    "interface_data_loopback-mode",
    "interface_data_forwarding-mode",
    "interface_data_ethernet_port-speed",
    "interface_data_ethernet_hw-mac-address",
    "interface_data_transceiver_oper-down-reason",
    "interface_data_subinterface_0_type",
    "interface_data_subinterface_0_name",
    "interface_data_subinterface_0_ipv4_address_0_ip-prefix",
    "interface_data_subinterface_0_ipv4_address_0_origin",
    "interface_data_subinterface_0_ipv4_address_0_status",
    "interface_data_subinterface_0_ipv4_srl_nokia-interfaces-nbr:arp_neighbor_0_link-layer-address",
    "interface_data_subinterface_0_ipv4_srl_nokia-interfaces-nbr:arp_neighbor_0_expiration-time",
    
  ]
  
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["gnmi_stats"]
  offset = "newest"
  data_format = "json"
  
  name_override = "stats"
  
  tag_keys = ["hostname"]

  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05.999999999Z07:00"
  

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "mytoken"
  organization = "myorg"
  bucket = "infldb"

