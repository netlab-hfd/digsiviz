version: "3"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - kafka_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    container_name: kafka
    ports:
      - 29092:29092
    networks:
      - kafka_network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL_SAME_HOST://localhost:29092
      KAFKA_LISTENERS: EXTERNAL_SAME_HOST://:29092,INTERNAL://:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL_SAME_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS: 120000


  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - 8086:8086
    networks:
      - kafka_network
    # Without these, ALL bucket data lives in the container's writable layer, and
    # a plain `docker compose down` (no -v needed) destroys it. Named volumes
    # survive down/up; only `down -v` clears them.
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${DOCKER_INFLUXDB_INIT_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  influx-setup:
    image: influxdb:2.7
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ../influxdb/manifest.yml:/manifest.yml:ro
      - ../influxdb/apply.sh:/apply.sh:ro
    # apply.sh pins one named stack. A bare `influx apply` creates a new stack
    # per run and duplicates every task -- see the comment in apply.sh.
    entrypoint: ["/bin/sh", "/apply.sh"]
    environment:
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    networks:
      - kafka_network

  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    depends_on:
      - influxdb
      - kafka
    ports:
      - 8125:8125/udp
    networks:
      - kafka_network
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

    environment:
      HOSTNAME: telegraf
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_DB: ${DOCKER_INFLUXDB_INIT_BUCKET}
      INFLUXDB_USER: ${DOCKER_INFLUXDB_INIT_USERNAME}
      INFLUXDB_USER_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}

  grafana:
    image: grafana/grafana:13.0.3
    container_name: grafana
    ports:
      - 3000:3000
    networks:
      - kafka_network
    volumes:
      - grafana-storage:/var/lib/grafana
      # Auto-provision datasource + dashboard (mirrors the influxdb manifest
      # sibling-dir layout). Read-only: files are the source of truth.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # Topology weathermap + time slider (the DigSiViz time machine).
      # SYNC so the plugin is present before dashboards provision; GF_INSTALL_PLUGINS
      # is deprecated as of Grafana 11.
      - GF_PLUGINS_PREINSTALL_SYNC=andrewbmchugh-flow-panel
      # Consumed by provisioning/datasources/influxdb.yml via $VAR interpolation.
      - INFLUX_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      - INFLUX_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - INFLUX_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET}


networks:
  kafka_network:
    name: kafka_docker_net

volumes:
  grafana-storage:
  influxdb-data:
  influxdb-config:
